{{ define "main" }}

<section class="bg-white dark:bg-gray-900">
  <div class="max-w-screen-xl px-4 pt-8 mx-auto sm:pt-16 lg:pt-24 pb-8">
    <h1 class="mb-8 text-3xl font-extrabold tracking-tight text-gray-900 lg:text-4xl dark:text-white">{{ .Title }}</h1>

    {{ with .Description }}
      <p class="mb-8 text-lg text-gray-500 dark:text-gray-400">{{ . }}</p>
    {{ end }}

    {{ with .Content }}
      <div class="mb-8 max-w-screen-md mx-auto text-lg text-gray-500 dark:text-gray-400">{{ . }}</div>
    {{ end }}
  </div>
</section>

{{ if .Params.faq }}
  {{ partial "faq.html" . }}
{{ end }}

{{ end }}
