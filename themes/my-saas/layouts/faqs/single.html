{{ define "main" }}

<section class="bg-white dark:bg-gray-900">
  <div class="max-w-screen-xl px-4 pt-8 mx-auto sm:pt-16 lg:pt-24 pb-8">
    <a href="{{ .CurrentSection.RelPermalink }}" class="inline-flex items-center mb-4 text-sm font-medium text-primary-600 hover:underline dark:text-primary-500">
      <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
      {{ .CurrentSection.Title }}
    </a>
    <h1 class="mb-8 text-3xl font-extrabold tracking-tight text-gray-900 lg:text-4xl dark:text-white">{{ .Title }}</h1>

    {{ with .Description }}
      <p class="mb-8 text-lg text-gray-500 dark:text-gray-400">{{ . }}</p>
    {{ end }}

    {{ with .Content }}
      <div class="mb-8 max-w-screen-md mx-auto text-lg text-gray-500 dark:text-gray-400">{{ . }}</div>
    {{ end }}
  </div>
</section>

{{ if .Params.faq }}
  {{ partial "faq.html" . }}
{{ end }}

{{ end }}
