{{ define "main" }}
<article>
  {{ partial "feature/hero.html" . }}

  {{ partial "feature/two-features.html" . }}

  <section class="bg-white dark:bg-gray-900">
    <div class="py-8 px-4 mx-auto max-w-screen-xl sm:py-16 lg:px-6">
        <div class="mx-auto max-w-screen-md text-center">
            <h2 class="mb-4 text-5xl tracking-tight font-extrabold leading-tight text-gray-900 dark:text-white">{{ .Params.cta.title }}</h2>
            <p class="mb-6 font-light text-gray-500 dark:text-gray-400 md:text-lg">{{ .Params.cta.description }}</p>
            <a href="#" class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-3 mr-2 mb-2 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800">Start now, free</a>
        </div>
    </div>
  </section>

  {{ if .Params.faq }}
    {{ partial "faq.html" . }}
  {{ end }}

</article>
{{ end }}
