{{ with .Params.featureList }}
<section class="bg-white py-12 dark:bg-gray-900 sm:py-16">
  <div class="mx-auto grid max-w-screen-xl gap-10 px-4 lg:grid-cols-[0.7fr_1.3fr] lg:px-6">
    <div class="lg:sticky lg:top-28 lg:self-start">
      <h2 class="mb-5 text-3xl font-extrabold tracking-tight text-gray-900 dark:text-white sm:text-4xl">{{ .title }}</h2>
      <p class="text-lg leading-relaxed text-gray-600 dark:text-gray-300">{{ .description }}</p>
    </div>

    <div class="divide-y divide-gray-200 border-y border-gray-200 dark:divide-gray-700 dark:border-gray-700">
      {{ range $feature := .features }}
      <section class="py-7 first:pt-1 last:pb-1">
        <h3 class="mb-4 text-xl font-bold text-gray-900 dark:text-white sm:text-2xl">{{ $feature.title }}</h3>
        <ul class="space-y-3">
          {{ range $feature.points }}
          <li class="flex gap-3 text-base leading-relaxed text-gray-600 dark:text-gray-300 sm:text-lg">
            <span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-primary-500" aria-hidden="true"></span>
            <span>{{ .description | safeHTML }}</span>
          </li>
          {{ end }}
        </ul>
      </section>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
