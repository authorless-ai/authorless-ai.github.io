<section class="bg-[#f7f7ff] dark:bg-gray-900 border-y border-primary-100 shadow-lg mb-8 py-8 lg:py-16">
  <div class="mx-auto max-w-screen-xl px-4 sm:grid sm:gap-8 sm:gap-12 md:grid-cols-3 pt-4">
    {{ range $index, $feature := .Params.introFeatures }}
    <div class="flex justify-center pb-8 sm:pb-0">
      {{ if eq $index 0 }}
      <svg class="w-8 h-8 mr-3 text-primary-600 dark:text-primary-500 shrink-0" aria-hidden="true"
           xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd"
              d="M14 4.182A4.136 4.136 0 0 1 16.9 3c1.087 0 2.13.425 2.899 1.182A4.01 4.01 0 0 1 21 7.037c0 1.068-.43 2.092-1.194 2.849L18.5 11.214l-5.8-5.71 1.287-1.31.012-.012Zm-2.717 2.763L6.186 12.13l2.175 2.141 5.063-5.218-2.141-2.108Zm-6.25 6.886-1.98 5.849a.992.992 0 0 0 .245 1.026 1.03 1.03 0 0 0 1.043.242L10.282 19l-5.25-5.168Zm6.954 4.01 5.096-5.186-2.218-2.183-5.063 5.218 2.185 2.15Z"
              clip-rule="evenodd"/>
      </svg>
      {{ else if eq $index 1 }}
      <svg class="w-8 h-8 mr-3 text-primary-600 dark:text-primary-500 shrink-0" aria-hidden="true"
           xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/>
      </svg>
      {{ else if eq $index 2 }}
      <svg class="w-8 h-8 mr-3 text-primary-600 dark:text-primary-500 shrink-0" aria-hidden="true"
           xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4.5V19a1 1 0 0 0 1 1h15M7 14l4-4 4 4 5-5m0 0h-3.207M20 9v3.207"/>
      </svg>
      {{ end }}

      <div>
        {{ if .url }}
        <a href="{{ .url }}">
        {{ end }}
          <h3 class="mb-1 text-lg md:text-xl font-semibold leading-tight text-gray-900 dark:text-white">{{ .title }}</h3>
          <p class="font-normal text-gray-700 dark:text-gray-400 text-base md:text-lg">{{ .description | safeHTML }}</p>

          {{ if .url }}
          <div class="flex justify-end mt-2">
            <p class="inline-flex items-center text-primary-600 hover:text-primary-800 dark:text-primary-500 dark:hover:text-primary-600 hover:underline">
              {{ T "learnMore" }}
              <svg class="ml-1 w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd"
                      d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                      clip-rule="evenodd"></path>
              </svg>
            </p>
          </div>
          {{ end }}
        {{ if .url }}
        </a>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</section>
