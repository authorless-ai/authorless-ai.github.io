<section class="bg-white dark:bg-gray-900">
    <div class="pt-8 lg:pt-16 px-4 mx-auto max-w-screen-xl">
        <div class="grid gap-8 items-center mb-8 lg:mb-18 lg:gap-12 lg:grid-cols-12">
            <div class="col-span-6 text-center sm:mb-6 lg:text-left lg:mb-0">
              {{ if .Params.superTitle }}
                <p class="uppercase text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-blue-800  font-extrabold mb-4 text-base">{{ .Params.superTitle }}</p>
              {{ end }}

                <h1 class="mb-4 text-4xl font-extrabold tracking-tight leading-none text-gray-900 md:text-5xl xl:text-6xl dark:text-white">{{ .Title }}</h1>
                <p class="mx-auto mb-6 max-w-xl font-normal text-gray-500 lg:mx-0 xl:mb-8 md:text-lg xl:text-xl dark:text-gray-400">{{ .Description | safeHTML }}</p>

              <a href="{{ site.Params.signupUrl }}"
               class="inline-flex justify-center items-center py-3 px-5 text-base font-medium text-center text-white rounded-lg bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 dark:focus:ring-primary-900">
                Try now, free
                <svg class="ml-2 -mr-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
                     xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                          d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                          clip-rule="evenodd"></path>
                </svg>
              </a>
            </div>
            <div class="col-span-6 p-16 bg-cover bg-left bg-no-repeat"
              {{ with resources.Get "images/bg-blob.png" }}
                style="background-image: url('{{ .RelPermalink }}');"
              {{ end }}>
                <iframe class="mx-auto w-full max-w-xl h-64 rounded-lg sm:h-96" src="{{ .Params.youtubeUrl }}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</section>
