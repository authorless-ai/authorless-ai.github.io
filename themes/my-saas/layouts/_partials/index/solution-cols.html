<section class="bg-white dark:bg-gray-900 antialiased">
  <div class="max-w-screen-xl px-4 py-8 mx-auto lg:px-6 sm:py-16 lg:py-24">
    <div class="max-w-3xl mx-auto text-center">
      <h2 class="text-3xl font-extrabold leading-tight tracking-tight text-gray-900 sm:text-4xl dark:text-white">
        {{ .title }}
      </h2>
      <p class="mt-4 text-base font-normal text-gray-500 sm:text-xl dark:text-gray-400">
        {{ .description }}
      </p>
    </div>

    <div class="p-4 mt-8 rounded-lg sm:p-12 lg:mt-16 bg-[#f7f7ff] dark:bg-gray-800">
      <div class="grid grid-cols-1 gap-8 sm:gap-12 lg:grid-cols-2">
        {{ range .cards }}
          <a href="{{ .url }}" class="">
            <div class="flex flex-col items-start gap-4 sm:gap-5 sm:flex-row">
              <div class="bg-gray-100 dark:bg-gray-700 rounded-full w-16 h-16 lg:w-24 lg:h-24 flex items-center justify-center shrink-0">
                {{ partial "components/icons.html" (dict "icon" .icon "class" "w-10 lg:w-12 h-10 lg:h-12") }}
              </div>
              <div class="w-full">
                <h3 class="text-xl font-bold text-gray-900 sm:text-2xl dark:text-white">
                  {{ .title }}
                </h3>
                <p class="mt-2 text-base font-normal text-gray-500 sm:text-lg dark:text-gray-400">
                  {{ .description }}
                </p>
                <div class="flex justify-end mt-2">
                  <p class="inline-flex items-center text-primary-600 hover:text-primary-800 dark:text-primary-500 dark:hover:text-primary-600 hover:underline">
                    Learn more
                    <svg class="ml-1 w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                      <path fill-rule="evenodd"
                            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                            clip-rule="evenodd"></path>
                    </svg>
                  </p>
                </div>
              </div>
            </div>
          </a>
        {{ end }}
      </div>
    </div>

    <div class="mt-8 text-center lg:mt-16">
      <a href="{{ site.Params.signupUrl }}" title=""
        class="text-white bg-primary-700 justify-center hover:bg-primary-800 inline-flex items-center  focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-lg px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800"
        role="button">
        Start now
        <svg aria-hidden="true" class="w-5 h-5 ml-2 -mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
          fill="currentColor">
          <path fill-rule="evenodd"
            d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z"
            clip-rule="evenodd" />
        </svg>
      </a>
    </div>
  </div>
</section>
