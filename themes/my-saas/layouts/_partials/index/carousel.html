{{ $carouselImages := resources.Match "images/carousel/*" }}
{{ $sortedImages := sort $carouselImages "RelPermalink" }}
{{/* Sorts images by their relative permalink */}}

<!-- Outer container for the background gradient image, acting as a section wrapper -->
<div class="relative">
  <!-- Background gradient image, positioned absolutely to cover the container -->
  <img src="{{ "images/bg-gradient.png" | relURL }}" alt="Background Gradient" class="absolute inset-0 w-full max-w-7xl h-3/4 mx-auto object-cover z-0 rounded-lg">

  <!-- Main carousel content wrapper, placed above the background gradient -->
  <div class="relative z-10 max-w-5xl mx-auto mb-8 py-8">
    <!-- The frame wrapper with blur, background, border-radius, and shadow -->
    <div class="relative p-4" style="backdrop-filter: blur(54px); background-color: rgba(255, 255, 255, 0.54); border-radius: 32px; box-shadow: rgba(0, 0, 0, 0.08) 0px 8px 32px 0px;">
      <div class="relative w-full" data-carousel="slide">
        <!-- Carousel wrapper -->
        <div class="relative h-56 overflow-hidden rounded-lg md:h-96">
             {{ range $index, $image := $sortedImages }}
             <!-- Item {{ add $index 1 }} -->
            <div class="hidden duration-700 ease-in-out" data-carousel-item>
                <img src="{{ $image.RelPermalink }}" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="Carousel image {{ add $index 1 }}">
            </div>
            {{ end }}
        </div>
        <!-- Slider indicators -->
        <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
            {{ range $index, $image := $sortedImages }}
            <button type="button" class="w-3 h-3 rounded-full" aria-current="{{ if eq $index 0 }}true{{ else }}false{{ end }}" aria-label="Slide {{ add $index 1 }}" data-carousel-slide-to="{{ $index }}"></button>
            {{ end }}
        </div>
        <!-- Slider controls -->
        <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
                <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
                </svg>
                <span class="sr-only">Previous</span>
            </span>
        </button>
        <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-next>
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
                <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                </svg>
                <span class="sr-only">Next</span>
            </span>
        </button>
      </div>
    </div>
  </div>
</div>
