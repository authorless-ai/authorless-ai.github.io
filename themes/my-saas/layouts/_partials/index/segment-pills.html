{{ with .Params.segmentPills }}
<section class="bg-white dark:bg-gray-900 -mt-2 pb-4">
  <div class="px-4 mx-auto max-w-screen-xl">
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
      {{ range . }}
      <a href="{{ .url }}"
         class="flex items-center justify-center p-3 text-base font-bold text-gray-600 rounded-lg bg-gray-50 hover:bg-gray-100 group hover:shadow dark:bg-gray-600 dark:hover:bg-gray-500 dark:text-white">
        {{ .title }}
        <svg class="ml-1.5 w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
        </svg>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
