<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $index, $item := .Params.faq -}}
    {{- if $index }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.q | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ delimit $item.a " " | plainify | jsonify }}
      }
    }
    {{- end }}
  ]
}
</script>
