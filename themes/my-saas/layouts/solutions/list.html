{{ define "main" }}
  {{ partial "index/hero.html" . }}

  <section class="bg-gray-50 dark:bg-gray-900">
    <div class="py-8 px-4 mx-auto max-w-screen-xl sm:py-16 lg:px-6">
      <div class="grid gap-8 md:grid-cols-2 lg:grid-cols-3">
        {{ range .Pages.ByWeight }}
        <a href="{{ .RelPermalink }}" class="block p-6 bg-white rounded-xl shadow border border-gray-200 hover:border-primary-300 dark:bg-gray-800 dark:border-gray-700">
          <p class="mb-2 text-xs font-bold uppercase tracking-widest text-primary-600">Solution</p>
          <h2 class="mb-3 text-2xl font-bold text-gray-900 dark:text-white">{{ .LinkTitle }}</h2>
          <p class="text-gray-600 dark:text-gray-400">{{ .Description }}</p>
          <p class="mt-5 font-medium text-primary-600">See how Bazam helps →</p>
        </a>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
