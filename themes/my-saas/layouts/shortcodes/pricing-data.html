{{ $pricing := hugo.Data.pricing }}{
  yearly: true,
  plans: {
    {{- range $pricing.plans }}
    {{ .id }}: {
      monthly: '{{ partial "pricing/price.html" .monthly }}',
      yearly: '{{ partial "pricing/price.html" .yearly }}'
    },
    {{- end }}
  },
  formatPrice(price) {
    return price;
  }
}
