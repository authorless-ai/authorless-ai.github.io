title: "Your Complete Marketing Toolkit — In One Agent"
description: "The Bazam agent brings together everything your team needs to create, publish, and measure content at scale — accessible through a single conversation."
features:
  - iconColor: "primary"
    title: "Create & Publish"
    icon: edit
    points:
      - description: "Ask the agent to <b>write blog posts, social campaigns, press releases, and ad copy</b> — all on-brand."
      - description: "Publish directly to <b>WordPress, Facebook, Instagram, LinkedIn, X, YouTube, and TikTok</b>."
      - description: "Schedule and queue content across channels with a <b>visual content calendar</b>."
      - description: "Repurpose existing content into new formats — turn a blog post into a social series automatically."
      - description: "Bulk-create content for multiple clients and campaigns simultaneously."
  - iconColor: "primary"
    title: "Know Your Brand"
    icon: chart
    points:
      - description: "Build rich <b>audience personas</b> with demographics, motivations, emotional drivers, and buying behaviour."
      - description: "Define and maintain a <b>consistent brand voice</b> across all content with configurable tone and style."
      - description: "Organise a <b>knowledge base</b> of docs, URLs, and product information the agent draws on for accuracy."
      - description: "Manage <b>multiple clients and brands</b> in separate projects — each with their own voice, audiences, and strategy."
      - description: "Run campaigns across multiple languages with <b>automated AI translation</b>."
  - iconColor: "primary"
    title: "Measure & Improve"
    icon: upload
    points:
      - description: "Track <b>engagement, reach, clicks, and follower growth</b> across every channel in one dashboard."
      - description: "Roll up performance data at the campaign, channel, and post level — <b>no more spreadsheets</b>."
      - description: "Ask the agent for a <b>performance summary</b> instead of logging into five platforms."
      - description: "Collaborate with your team using <b>role-based access control</b> and approval workflows."
      - description: "Transparent <b>credit-based usage</b> so you always know exactly what you're spending."
