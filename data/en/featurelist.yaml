title: "One audience in. Everything out."
description: "Model the reader once and it drives the whole operation, not just the first draft. Bazam writes it, translates it, schedules it, publishes it and reports back."
features:
  - iconColor: "primary"
    title: "Write to the model"
    icon: edit
    points:
      - description: "Generate <b>30+ content types</b>: blog posts, social campaigns, ad copy, case studies, how-tos, listicles, comparisons, FAQs and quote cards, every one written to the audience you picked."
      - description: "Choose the <b>angle</b> as well as the audience: a time-saving hook for one reader, a risk-and-compliance hook for the next."
      - description: "Repurpose what you already have. Point Bazam at a <b>URL, a document, or an audio or video file</b> and a podcast becomes a listicle."
      - description: "Set a <b>brand voice</b> once (formality, enthusiasm, directness, plus your own guidelines) and every piece inherits it."
      - description: "Feed in a <b>knowledge base</b> of docs, URLs and product facts so content works from what's true, not what the AI assumed."
      - description: "Work where you already are. Bazam's <b>MCP server</b> pulls your audiences, brand voice and channels into Claude, ChatGPT or any other MCP client."
  - iconColor: "primary"
    title: "Publish everywhere"
    icon: upload
    points:
      - description: "Publish direct to <b>Facebook, Instagram, TikTok, X, LinkedIn and WordPress</b>. No exporting, no copy-pasting."
      - description: "One brief becomes a <b>distinct version per platform</b>, with the copy, tone and media aspect ratio adapted to each."
      - description: "Handles the formats each channel rewards: <b>threaded posts</b>, and links moved to the first comment where that performs better."
      - description: "Plan and queue everything on a <b>visual calendar</b> with drag-and-drop rescheduling, recurring slots and multi-day campaigns."
      - description: "Route work through <b>approvals</b> so nothing goes live without a yes."
  - iconColor: "primary"
    title: "Every market, every metric"
    icon: language
    points:
      - description: "Translate any campaign into <b>50+ languages</b>, keeping your brand voice intact in each one."
      - description: "Run the same launch across <b>multiple markets</b> at once, on one calendar."
      - description: "Compare channels on equal terms. TikTok views and LinkedIn impressions are <b>normalised into one set of metrics</b>."
      - description: "Roll results up by <b>campaign, channel or post</b>, with snapshots over time so you can see what moved and when."
      - description: "Keep <b>separate projects</b> per brand or client, with role-based access across the team."
