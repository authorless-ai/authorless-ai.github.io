id: comparison_tools
prefix: fg_cmp_tools
title: "Bazam vs the tools you're probably weighing up"
subtitle: "Everyone here builds on the same frontier models. What differs is what those models get told, and how much of the job is left for you afterwards. "

columns:
  - id: chatgpt
    heading: "ChatGPT"
  - id: blaze
    heading: "Blaze"
  - id: anyword
    heading: "Anyword"
  - id: bazam
    heading: "Bazam"
    highlight: true

sections:
  - id: brief
    name: "What the AI is told"
    rows:
      - id: reader
        feature: "Who it's writing to"
        values:
          - text: "Whatever you typed this time"
          - text: "Your brand and industry"
          - text: "A persona you write yourself"
          - text: "A 30-point model, per audience"
      - id: subject
        feature: "What it's writing about"
        desc: "Your company, brand and offerings, held as profiles"
        values:
          - check: false
            text: "Re-paste it every time"
          - check: true
            text: "Brand profile"
          - check: true
            text: "Brand voice and guidelines"
          - check: true
            text: "Company, brand, offering"
      - id: depth
        feature: "Knows their drivers, values and buying behaviour"
        values:
          - check: false
          - check: false
          - check: false
            text: "Pain points only"
          - check: true
      - id: persists
        feature: "Survives between sessions"
        values:
          - check: false
            text: "Gone with the chat"
          - check: true
          - check: true
          - check: true
            text: "The model is yours"
      - id: mcp
        feature: "Brings your setup into other AI tools"
        values:
          - check: false
            text: "Nothing to bring"
          - check: false
          - check: true
            text: "ChatGPT, Notion, Gemini"
          - check: true
            text: "MCP: audiences, voice, publishing"

  - id: generating
    name: "Generating"
    rows:
      - id: quality
        feature: "Draft quality from a good prompt"
        values:
          - check: true
            text: "Excellent"
          - check: true
            text: "Good"
          - check: true
            text: "Good"
          - check: true
            text: "Excellent"
      - id: angles
        feature: "Different angles per audience"
        values:
          - check: false
            text: "Only if you re-prompt"
          - check: false
          - check: false
          - check: true
      - id: types
        feature: "Marketing content types built in"
        values:
          - check: false
          - check: true
          - check: true
          - check: true
            text: "30+"
      - id: prediction
        feature: "Predicts performance before you publish"
        values:
          - check: false
          - check: false
          - check: true
            text: "Their core feature"
          - check: false

  - id: shipping
    name: "Getting it out the door"
    rows:
      - id: publishing
        feature: "Publishes to your channels"
        values:
          - check: false
          - check: true
            text: "8 channels"
          - check: false
          - check: true
            text: "6 platforms, direct"
      - id: scheduling
        feature: "Content calendar and scheduling"
        values:
          - check: false
          - check: true
          - check: false
          - check: true
      - id: translation
        feature: "Translation into 50+ languages"
        values:
          - check: false
            text: "One at a time, by hand"
          - check: false
          - check: false
          - check: true
      - id: analytics
        feature: "Analytics on what you published"
        values:
          - check: false
          - check: true
          - check: true
            text: "Content intelligence"
          - check: true
            text: "Normalised across channels"
      - id: approvals
        feature: "Approvals and client sign-off"
        desc: "Clients review in their own portal, without your passwords"
        values:
          - check: false
          - check: false
          - check: false
          - check: true

