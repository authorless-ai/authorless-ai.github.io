title: "Un perfil de audiencia para toda la creación de contenido"
description: "Crea un perfil de audiencia una vez y Bazam lo utiliza para toda la creación de contenido. Después traduce, programa, publica y te devuelve los resultados."
features:
  - iconColor: "primary"
    title: "Escribe desde el perfil de audiencia"
    icon: edit
    points:
      - description: "Genera <b>más de 30 tipos de contenido</b>: artículos de blog, campañas sociales, textos publicitarios, casos de estudio, guías, listas, comparativas, preguntas frecuentes y tarjetas de citas, todos escritos para la audiencia que elegiste."
      - description: "Elige tanto el <b>ángulo</b> como la audiencia: un gancho de ahorro de tiempo para un lector, uno de riesgo y cumplimiento para el siguiente."
      - description: "Reutiliza lo que ya tienes. Indica a Bazam <b>una URL, un documento o un archivo de audio o vídeo</b> y un pódcast se convierte en una lista."
      - description: "Configura una <b>voz de marca</b> una vez (formalidad, entusiasmo, tono directo y tus propias pautas) y cada pieza la hereda."
      - description: "Añade una <b>base de conocimiento</b> de documentos, URL y datos de producto para que el contenido parta de la verdad, no de lo que supuso la IA."
      - description: "Bazam también perfila <b>tu lado de la conversación</b>: empresa, marca y ofertas, extraídos de tu sitio web, para que el contenido sea preciso sobre ti y esté dirigido a ellos."
      - description: "Trabaja donde ya estás. El <b>servidor MCP</b> de Bazam lleva tus audiencias, voz de marca y canales a Claude, ChatGPT o cualquier otro cliente MCP."
  - iconColor: "primary"
    title: "Publica en todas partes"
    icon: upload
    points:
      - description: "Publica directamente en <b>Facebook, Instagram, TikTok, X, LinkedIn y WordPress</b>. Sin exportar, sin copiar y pegar."
      - description: "Un brief se convierte en una <b>versión distinta para cada plataforma</b>, con texto, tono y proporción de imagen adaptados a cada una."
      - description: "Gestiona los formatos que cada canal premia: <b>hilos de publicaciones</b> y enlaces trasladados al primer comentario cuando rinden mejor."
      - description: "Coloca todo en un <b>calendario visual</b> mientras lo creas y luego arrastra y suelta para ajustar el plan."
      - description: "Pasa el trabajo por <b>aprobaciones</b> para que nada se publique sin un sí."
  - iconColor: "primary"
    title: "Cada mercado, cada métrica"
    icon: language
    points:
      - description: "Traduce cualquier campaña a <b>más de 50 idiomas</b>, manteniendo intacta tu voz de marca."
      - description: "Lanza la misma campaña en <b>varios mercados</b> a la vez, en un solo calendario."
      - description: "Compara canales en igualdad de condiciones. Las visualizaciones de TikTok y las impresiones de LinkedIn se <b>normalizan en un mismo conjunto de métricas</b>."
      - description: "Agrupa los resultados por <b>campaña, canal o publicación</b>, con instantáneas a lo largo del tiempo para ver qué cambió y cuándo."
      - description: "Mantén <b>proyectos separados</b> por marca o cliente, con acceso basado en roles para el equipo."
