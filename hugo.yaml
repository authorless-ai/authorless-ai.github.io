baseURL: 'https://authorless.ai/'
relativeURLs: false
canonifyURLs: false

build:
  writeStats: true

languageCode: 'en-us'
title: 'Authorless'
theme: 'my-saas'

params:
  author: Authorless
  appUrl: https://app.authorless.ai
  recaptchaPublicKey: 6Lf5CQ0qAAAAAHhXYC7rLEnkTZLIGpeP8nnYsVzq
  privacyPolicy: https://app.authorless.ai/pages/legals/privacy-policy/
  mailingListSubscribe: https://app.authorless.ai/feedback/subscribe

languages:
  en:
    contentDir: 'content/en'
    disabled: false
    languageCode: 'en-US'
    languageName: 'English'
    weight: 1
  fr:
    contentDir: 'content/fr'
    disabled: true
    languageCode: 'fr'
    languageName: 'Français'
    weight: 2

disableKinds:
  - taxonomy

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6

menus:
  featuresMenu:
    - name: AI Content Writing
      url: "/features/content-writing/"
      weight: 10
      params:
        description: "Create professional-quality content in minutes, not hours"
    - name: Multi-Platform Scheduling
      url: "/features/scheduling/"
      weight: 20
      params:
        description: "Maintain consistency with automated content scheduling"
    - name: Direct Publishing
      url: "/features/publishing/"
      weight: 30
      params:
        description: "Post everywhere with one-click multi-platform publishing"
    - name: AI Content Suggestions
      url: "/features/suggestions/"
      weight: 40
      params:
        description: "Never run out of ideas with AI-powered content suggestions"
    - name: Marketing Strategy
      url: "/features/marketing-strategy/"
      weight: 50
      params:
        description: "Drive results with automatic customer journey content"
    - name: AI Content Translation
      url: "/features/translation/"
      weight: 60
      params:
        description: "Reach global audiences with instant AI content translation"
    - name: Built for Teams
      url: "/features/teams/"
      weight: 70
      params:
        description: "Collaborate seamlessly with your team on all your content"
    - name: Multiple Brands and Projects
      url: "/features/projects/"
      weight: 80
      params:
        description: "Manage content for multiple brands or projects from a single account"
  resourcesMenu:
    - name: Documentation
      url: /docs/
      weight: 10
      params:
        description: "Access our comprehensive documentation"
    - name: Blog
      url: /blog/
      weight: 20
      params:
        description: "All the latest on our blog"
  solutionsMenu:
  - name: For Thought Leaders & Experts
    url: /solutions/thought-leaders/
    weight: 10
    params:
      description: "Automate social posts to build authority while you sleep"
  - name: For Influencers & Creators
    url: /solutions/influencers/
    weight: 20
    params:
      description: "Effortless growth with multi-platform publishing and automation"
  - name: For Dropshippers
    url: /solutions/dropshippers/
    weight: 30
    params:
      description: "Bulk content creation and automated social media campaigns"
  - name: For Non-Profits and Charities
    url: /solutions/non-profits/
    weight: 40
    params:
      description: "Amplify mission, engaging stories, effortless scheduling"
  - name: For Businesses
    url: /solutions/businesses/
    weight: 50
    params:
      description: "Consistent lead generation with automated strategy and calendar"
  - name: For Marketing Agencies
    url: /solutions/agencies/
    weight: 60
    params:
      description: "Deliver results, scale content with efficient AI power"
