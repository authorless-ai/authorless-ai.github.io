baseURL: 'https://authorless.ai/'
relativeURLs: false
canonifyURLs: false

build:
  writeStats: true

languageCode: 'en-us'
title: 'Authorless'
theme: 'my-saas'

params:
  author: Authorless
  appUrl: https://app.authorless.ai
  recaptchaPublicKey: 6Lf5CQ0qAAAAAHhXYC7rLEnkTZLIGpeP8nnYsVzq
  privacyPolicy: https://app.authorless.ai/pages/legals/privacy-policy/
  mailingListSubscribe: https://app.authorless.ai/feedback/subscribe

languages:
  en:
    contentDir: 'content/en'
    disabled: false
    languageCode: 'en-US'
    languageName: 'English'
    weight: 1
  fr:
    contentDir: 'content/fr'
    disabled: true
    languageCode: 'fr'
    languageName: 'Français'
    weight: 2

disableKinds:
  - taxonomy

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6

menus:
  featuresMenu:
    - name: Translation
      url: /features/translation
      weight: 10
      params:
        description: "Description of Feature A"
    - name: Feature B
      url: /features/b/
      weight: 20
      params:
        description: "Description of Feature B"
  resourcesMenu:
    - name: Documentation
      url: /docs/
      weight: 10
      params:
        description: "Access our comprehensive documentation."
    - name: Blog
      url: /blog/
      weight: 20
      params:
        description: "All the latest on our blog."
  solutionsMenu:
    - name: Solution A
      url: /docs/
      weight: 10
      params:
        description: "Access our comprehensive documentation."
    - name: Solution B
      url: /support/
      weight: 20
      params:
        description: "Get help and support from our team."
