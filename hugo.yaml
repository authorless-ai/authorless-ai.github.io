baseURL: 'https://bazam.ai/'
relativeURLs: false
canonifyURLs: false

build:
  writeStats: true

locale: 'en-us'
title: 'Bazam'
theme: 'my-saas'

params:
  author: Bazam
  appUrl: https://app.bazam.ai
  recaptchaPublicKey: 6LenXWAsAAAAAIkP88QQKb2IKeKbhRgTh7XfDR7L
  privacyPolicy: https://app.bazam.ai/pages/legals/privacy-policy/
  termsUrl: https://app.bazam.ai/pages/legals/terms/
  mailingListSubscribe: https://app.bazam.ai/feedback/subscribe
  socials:
    - name: Instagram
      url: https://www.instagram.com/bazam.ai/
      icon: instagram
  # The site is in early access: every primary CTA goes to the waitlist form,
  # not to self-serve signup.
  signupUrl: /#early-access

services:
  googleAnalytics:
    id: G-G071P00MTW

languages:
  en:
    contentDir: 'content/en'
    disabled: false
    locale: 'en-US'
    label: 'English'
    weight: 1
  # Translations are parked while the site is repositioned around the
  # 30-Point Audience Model. Re-enable a language once its content has been
  # rewritten — the old trees still describe the pre-MVP product.
  fr:
    contentDir: 'content/fr'
    disabled: true
    locale: 'fr'
    label: 'Français'
    weight: 2
  es:
    contentDir: 'content/es'
    disabled: true
    locale: 'es'
    label: 'Español'
    weight: 3
  de:
    contentDir: 'content/de'
    disabled: true
    locale: 'de'
    label: 'Deutsch'
    weight: 4
  pt:
    contentDir: 'content/pt'
    disabled: true
    locale: 'pt'
    label: 'Português'
    weight: 5
  it:
    contentDir: 'content/it'
    disabled: true
    locale: 'it'
    label: 'Italiano'
    weight: 6

disableKinds:
  - taxonomy

security:
  allowContent:
    - ^text/markdown$
    - ^text/html$
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6

menus:
  main:
  - name: "How it works"
    url: "/how-it-works/"
    weight: 10
  - name: "Audience profiles"
    url: "/audience-profile/"
    weight: 20
  - name: "Features"
    identifier: "features"
    weight: 25
  - name: "Pricing"
    url: "/pricing/"
    weight: 30
  - name: "Contact"
    url: "/contact/"
    weight: 50
  features:
  - name: "AI marketing assistant"
    url: "/features/agent/"
    weight: 10
    params:
      description: "Create, research, plan and check results through a conversation."
  - name: "Audience profiles"
    url: "/audience-profile/"
    weight: 20
    params:
      description: "Understand who you are talking to before you start writing."
  - name: "AI content creation"
    url: "/features/content-writing/"
    weight: 30
    params:
      description: "Create 30+ types of content without starting from a blank page."
  - name: "Content ideas"
    url: "/features/suggestions/"
    weight: 40
    params:
      description: "Get relevant topics based on your brand, audience and goals."
  - name: "Campaigns"
    url: "/features/marketing-strategy/"
    weight: 50
    params:
      description: "Keep every piece tied to an audience and a clear goal."
  - name: "Knowledge base"
    url: "/features/knowledge-base/"
    weight: 60
    params:
      description: "Give Bazam your real facts, sources and brand guidance."
  - name: "Content calendar"
    url: "/features/scheduling/"
    weight: 70
