baseURL: 'https://authorless.ai/'
relativeURLs: false
canonifyURLs: false

build:
  writeStats: true

languageCode: 'en-us'
title: 'Authorless'
theme: 'my-saas'

params:
  author: Authorless
  appUrl: https://app.authorless.ai
  recaptchaPublicKey: 6Lf5CQ0qAAAAAHhXYC7rLEnkTZLIGpeP8nnYsVzq
  privacyPolicy: https://app.authorless.ai/pages/legals/privacy-policy/
  mailingListSubscribe: https://app.authorless.ai/feedback/subscribe
  signupUrl: https://app.authorless.ai/accounts/signup/

services:
  googleAnalytics:
    id: G-2MXX2DWFBQ

languages:
  en:
    contentDir: 'content/en'
    disabled: false
    languageCode: 'en'
    languageName: 'English'
    weight: 1
    menu:
      main:
        - name: Features
          identifier: features
          weight: 10
        - name: Solutions
          identifier: solutions
          weight: 20
        - name: Pricing
          url: /pricing/
          weight: 30
        - name: Contact
          url: /contact/
          weight: 40
  es:
    contentDir: 'content/es'
    disabled: false
    languageCode: 'es'
    languageName: 'Español'
    weight: 2
    menu:
      main:
        - name: Características
          identifier: features
          url: /es/features/
          weight: 10
        - name: Soluciones
          identifier: solutions
          url: /es/solutions/
          weight: 20
        - name: Precios
          identifier: pricing
          url: /es/pricing/
          weight: 30
        - name: Contacto
          identifier: contact
          url: /es/contact/
          weight: 40

disableKinds:
  - taxonomy

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6

menus:
  features:
    - name: "content-writing"
      url: "/features/content-writing/"
      weight: 10
      params:
        description: "description_content_writing"
    - name: "scheduling"
      url: "/features/scheduling/"
      weight: 20
      params:
        description: "description_scheduling"
    - name: "publishing"
      url: "/features/publishing/"
      weight: 30
      params:
        description: "description_publishing"
    - name: "suggestions"
      url: "/features/suggestions/"
      weight: 40
      params:
        description: "description_suggestions"
    - name: "marketing-strategy"
      url: "/features/marketing-strategy/"
      weight: 50
      params:
        description: "description_marketing_strategy"
    - name: "translation"
      url: "/features/translation/"
      weight: 60
      params:
        description: "description_translation"
    - name: "teams"
      url: "/features/teams/"
      weight: 70
      params:
        description: "description_teams"
    - name: "projects"
      url: "/features/projects/"
      weight: 80
      params:
        description: "description_projects"
  solutions:
    - name: "agencies"
