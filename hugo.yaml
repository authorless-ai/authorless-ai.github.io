      description: "Share work, control access and approve before publishing."
  compareMenu:
  - name: "Alternatives compared"
    url: "/alternatives/"
    weight: 10
  - name: "Bazam vs ChatGPT"
    url: "/alternatives/bazam-vs-chatgpt/"
    weight: 20
  - name: "Bazam vs Anyword"
    url: "/alternatives/bazam-vs-anyword/"
    weight: 30
  - name: "Bazam vs Blaze"
    url: "/alternatives/bazam-vs-blaze/"
    weight: 40
  solutionsMenu:
  - name: "Small businesses"
    url: "/solutions/small-businesses/"
    weight: 10
  toolsMenu:
  - name: "Website marketing plan"
    url: "/tools/website-marketing-plan/"
    weight: 10
