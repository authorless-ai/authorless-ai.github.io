baseURL: 'https://authorless.ai/'
relativeURLs: false
canonifyURLs: false

build:
  writeStats: true

languageCode: 'en-us'
title: 'Authorless'
theme: 'my-saas'

params:
  author: Authorless
  appUrl: https://app.authorless.ai
  recaptchaPublicKey: 6Lf5CQ0qAAAAAHhXYC7rLEnkTZLIGpeP8nnYsVzq
  privacyPolicy: https://app.authorless.ai/pages/legals/privacy-policy/
  mailingListSubscribe: https://app.authorless.ai/feedback/subscribe
  signupUrl: https://app.authorless.ai/accounts/signup/

services:
  googleAnalytics:
    id: G-2MXX2DWFBQ

languages:
  en:
    contentDir: 'content/en'
    disabled: false
    languageCode: 'en-US'
    languageName: 'English'
    weight: 1
  fr:
    contentDir: 'content/fr'
    disabled: true
    languageCode: 'fr'
    languageName: 'Français'
    weight: 2
  es:
    contentDir: 'content/es'
    disabled: false
    languageCode: 'es'
    languageName: 'Español'
    weight: 3

disableKinds:
  - taxonomy

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6

