baseURL: 'https://bazam.ai/'
relativeURLs: false
canonifyURLs: false

build:
  writeStats: true

locale: 'en-us'
title: 'Bazam'
theme: 'my-saas'

params:
  author: Bazam
  appUrl: https://app.bazam.ai
  recaptchaPublicKey: 6LenXWAsAAAAAIkP88QQKb2IKeKbhRgTh7XfDR7L
  privacyPolicy: https://app.bazam.ai/pages/legals/privacy-policy/
  termsUrl: https://app.bazam.ai/pages/legals/terms/
  mailingListSubscribe: https://app.bazam.ai/feedback/subscribe
  socials:
    - name: Instagram
      url: https://www.instagram.com/bazam.ai/
      icon: instagram
  # The site is in early access: every primary CTA goes to the waitlist form,
  # not to self-serve signup.
  signupUrl: /#early-access

services:
  googleAnalytics:
    id: G-G071P00MTW

languages:
  en:
    contentDir: 'content/en'
    disabled: false
    locale: 'en-US'
    label: 'English'
    weight: 1
  # Translations are parked while the site is repositioned around the
  # 30-Point Audience Model. Re-enable a language once its content has been
  # rewritten — the old trees still describe the pre-MVP product.
  fr:
    contentDir: 'content/fr'
    disabled: true
    locale: 'fr'
    label: 'Français'
    weight: 2
  es:
    contentDir: 'content/es'
    disabled: true
    locale: 'es'
    label: 'Español'
    weight: 3
  de:
    contentDir: 'content/de'
    disabled: true
    locale: 'de'
    label: 'Deutsch'
    weight: 4
  pt:
    contentDir: 'content/pt'
    disabled: true
    locale: 'pt'
    label: 'Português'
    weight: 5
  it:
    contentDir: 'content/it'
    disabled: true
    locale: 'it'
    label: 'Italiano'
    weight: 6

disableKinds:
  - taxonomy

security:
  allowContent:
    - ^text/markdown$
    - ^text/html$
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: colorful
  tableOfContents:
    startLevel: 2
    endLevel: 6

menus:
  main:
  - name: "How it works"
    url: "/how-it-works/"
    weight: 10
  - name: "Audience profiles"
    url: "/audience-profile/"
    weight: 20
  - name: "Pricing"
    url: "/pricing/"
    weight: 30
  - name: "Contact"
    url: "/contact/"
    weight: 50
  compareMenu:
  - name: "Alternatives compared"
    url: "/alternatives/"
    weight: 10
  - name: "Bazam vs ChatGPT"
    url: "/alternatives/bazam-vs-chatgpt/"
    weight: 20
  - name: "Bazam vs Anyword"
    url: "/alternatives/bazam-vs-anyword/"
    weight: 30
  - name: "Bazam vs Blaze"
    url: "/alternatives/bazam-vs-blaze/"
    weight: 40
  solutionsMenu:
  - name: "Small businesses"
    url: "/solutions/small-businesses/"
    weight: 10
